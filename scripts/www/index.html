<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>爱刷题</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: -apple-system, sans-serif;
	background: #f5f7fa;
	color: #1e293b;
	padding: 12px;
}

#app {
	max-width: 480px;
	margin: 0 auto;
}

.page {
	display: none;
}

.page.active {
	display: block;
}

.card {
	background: #fff;
	border-radius: 12px;
	padding: 16px;
	margin-bottom: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}

.btn {
	display: block;
	width: 100%;
	padding: 14px;
	border: none;
	border-radius: 10px;
	font-size: 16px;
	font-weight: 600;
	cursor: pointer;
	margin-bottom: 8px;
}

.btn:active {
	transform: scale(0.97);
}

.btn-primary {
	background: #2563eb;
	color: #fff;
}

.btn-success {
	background: #16a34a;
	color: #fff;
}

.btn-warning {
	background: #f59e0b;
	color: #fff;
}

.btn-danger {
	background: #dc2626;
	color: #fff;
}

.btn-outline {
	background: transparent;
	color: #2563eb;
	border: 2px solid #2563eb;
}

.btn-lg {
	padding: 18px;
	font-size: 20px;
}

.app-title {
	text-align: center;
	font-size: 24px;
	font-weight: 700;
	padding: 12px 0;
	color: #0f172a;
}

.stats {
	display: flex;
	justify-content: space-around;
	font-size: 14px;
}

.footer {
	text-align: center;
	font-size: 13px;
	color: #94a3b8;
	padding: 8px 0;
}

.back-row {
	display: flex;
	align-items: center;
	gap: 8px;
	color: #2563eb;
	font-weight: 500;
	cursor: pointer;
	margin-bottom: 12px;
}

.practice-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 8px;
}

.exit-btn {
	background: none;
	border: none;
	font-size: 20px;
	color: #94a3b8;
	cursor: pointer;
}

.progress-bar {
	width: 100%;
	height: 4px;
	background: #e2e8f0;
	border-radius: 4px;
	overflow: hidden;
	margin: 8px 0 12px;
}

.progress-bar .bar {
	height: 100%;
	background: #2563eb;
	transition: width 0.3s;
}

.q-type {
	font-size: 13px;
	color: #2563eb;
	background: #eff6ff;
	display: inline-block;
	padding: 0 12px;
	border-radius: 10px;
}

.q-number {
	font-size: 13px;
	color: #64748b;
	margin: 4px 0;
}

.q-text {
	font-size: 17px;
	font-weight: 500;
	line-height: 1.7;
	margin: 8px 0 14px;
}

.options {
	display: flex;
	flex-direction: column;
	gap: 8px;
}

.option {
	display: block;
	width: 100%;
	text-align: left;
	padding: 12px 16px;
	background: #f8fafc;
	border: 2px solid transparent;
	border-radius: 8px;
	cursor: pointer;
	font-size: 15px;
}

.option:active {
	transform: scale(0.98);
}

.option.selected {
	border-color: #2563eb;
	background: #eff6ff;
}

.option.correct {
	border-color: #16a34a;
	background: #dcfce7;
}

.option.wrong {
	border-color: #dc2626;
	background: #fee2e2;
}

.option.disabled {
	cursor: not-allowed;
	opacity: 0.7;
}

.source-box {
	margin-top: 12px;
	padding: 12px;
	background: #f0f9ff;
	border-radius: 8px;
	border-left: 4px solid #2563eb;
	display: none;
	font-size: 14px;
	line-height: 1.8;
}

.source-box.show {
	display: block;
}

.wrong-hint {
	color: #dc2626;
	font-weight: 500;
}

.correct-answer {
	color: #16a34a;
	font-weight: 600;
}

.practice-footer {
	display: flex;
	gap: 10px;
	margin-top: 12px;
}

.practice-footer .btn {
	flex: 1;
	margin-bottom: 0;
}

.result-card {
	text-align: center;
}

.result-score {
	font-size: 48px;
	font-weight: 800;
	color: #2563eb;
	padding: 16px 0;
}

.result-stats {
	display: flex;
	justify-content: center;
	gap: 24px;
	margin: 12px 0;
}

.result-stats .num {
	font-size: 24px;
	font-weight: 700;
}

.result-stats .num.green {
	color: #16a34a;
}

.result-stats .num.red {
	color: #dc2626;
}

.result-actions {
	display: flex;
	flex-direction: column;
	gap: 8px;
	margin-top: 12px;
}

.toast {
	position: fixed;
	bottom: 30px;
	left: 50%;
	transform: translateX(-50%);
	background: #1e293b;
	color: #fff;
	padding: 10px 24px;
	border-radius: 10px;
	font-size: 14px;
	opacity: 0;
	transition: opacity 0.3s;
	pointer-events: none;
	z-index: 999;
}

.toast.show {
	opacity: 1;
}

.chapter-list .btn {
	margin-bottom: 6px;
}

.wb-item {
	display: flex;
	gap: 10px;
	padding: 8px 0;
	border-bottom: 1px solid #f1f5f9;
}

.wb-item:last-child {
	border-bottom: none;
}

.wb-item .idx {
	font-weight: 600;
	color: #94a3b8;
	width: 28px;
}

.wb-item .content {
	flex: 1;
}

.wb-item .badge {
	font-size: 12px;
	background: #f1f5f9;
	padding: 2px 10px;
	border-radius: 20px;
}

.wrong-actions {
	display: flex;
	gap: 10px;
	margin-top: 12px;
}

.wrong-actions .btn {
	flex: 1;
	margin-bottom: 0;
}

.flex-between {
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.text-muted {
	color: #64748b;
	font-size: 14px;
}
/* 首页题库选择 */
.bank-selector {
	display: flex;
	flex-direction: column;
	gap: 12px;
	margin-top: 8px;
}

.bank-selector .btn {
	padding: 20px;
	font-size: 18px;
}

.bank-selector .btn .sub {
	font-size: 13px;
	font-weight: 400;
	display: block;
	margin-top: 4px;
	color: #e0f2fe; /* 浅蓝白，在深色背景上清晰 */
}

.hidden {
	display: none;
}
</style>
</head>
<body>
	<div id="app">
		<div id="toast" class="toast"></div>

		<!-- ========== 首页（选择题库） ========== -->
		<div id="page-home" class="page active">
			<div class="app-title">🎯爱刷题</div>
			<div class="card">
				<p style="text-align: center; color: #64748b; margin-bottom: 12px;">请选择要练习的题库</p>
				<div class="bank-selector">
					<button class="btn btn-primary" onclick="selectBank('retail')">
						🏪 零售管理 <span class="sub">200道 · 存款/理财/消保等</span>
					</button>
					<button class="btn btn-success" onclick="selectBank('operation')">
						⚙️ 运营管理 <span class="sub">1000道 · 柜面/支付/反诈等</span>
					</button>
				</div>
				<div
					style="text-align: center; margin-top: 16px; font-size: 13px; color: #94a3b8;"
					id="bank-status">请选择题库开始练习</div>
			</div>
		</div>

		<!-- ========== 主界面（选择后显示） ========== -->
		<div id="page-main" class="page">
			<div class="card" style="padding: 12px;">
				<div class="flex-between">
					<span style="font-weight: 600;" id="current-bank-label">🏪
						零售管理</span>
					<button class="btn btn-outline btn-sm" onclick="goHome()"
						style="width: auto; padding: 6px 12px; font-size: 13px;">切换题库</button>
				</div>
			</div>
			<div class="card home-menu">
				<button class="btn btn-primary" onclick="startOrder()">📚
					顺序练习</button>
				<button class="btn btn-success" onclick="showChapters()">🎯
					专项练习</button>
				<button class="btn btn-warning" onclick="startWrong()">
					📕 错题本 <span id="wrong-badge"
						style="margin-left: auto; background: rgba(255, 255, 255, 0.25); padding: 0 14px; border-radius: 20px; font-size: 14px;">0</span>
				</button>
			</div>
			<div class="card">
				<div class="stats">
					<span>📖 <strong id="p-total">0</strong></span> <span>✅ <strong
						id="p-correct">0</strong></span> <span>📈 <strong id="p-rate">0%</strong></span>
				</div>
			</div>
			<div class="footer">
				题库 <span id="total-count">0</span> 道
			</div>
		</div>

		<!-- ========== 章节 ========== -->
		<div id="page-chapter" class="page">
			<div class="back-row" onclick="goMain()">‹ 返回</div>
			<div class="card">
				<h3>📂 选择专项</h3>
				<div id="chapter-list" class="chapter-list"></div>
			</div>
		</div>

		<!-- ========== 答题 ========== -->
		<div id="page-practice" class="page">
			<div class="card">
				<div class="practice-header">
					<span id="practice-progress">1/200</span> <span id="practice-mode">顺序</span>
					<button class="exit-btn" onclick="confirmExit()">✕</button>
				</div>
				<div class="progress-bar">
					<div class="bar" id="practice-bar"></div>
				</div>
				<div id="q-type" class="q-type">单选题</div>
				<div id="q-number" class="q-number">第 1 题</div>
				<div id="q-text" class="q-text">加载中...</div>
				<div id="q-options" class="options"></div>
				<div id="source-box" class="source-box">
					<div id="wrong-hint" class="wrong-hint"></div>
					<div id="correct-answer" class="correct-answer"></div>
					<div>
						📖 <span id="source-text"></span>
					</div>
				</div>
				<div class="practice-footer">
					<button class="btn btn-primary" id="btn-submit"
						onclick="submitAnswer()">提交</button>
					<button class="btn btn-success" id="btn-next"
						onclick="nextQuestion()" style="display: none;">下一题 →</button>
				</div>
			</div>
		</div>

		<!-- ========== 结果 ========== -->
		<div id="page-result" class="page">
			<div class="card result-card">
				<div class="result-score">
					<div id="result-score">0%</div>
				</div>
				<div class="result-stats">
					<div>
						<div class="num green" id="r-correct">0</div>
						<div>✅ 答对</div>
					</div>
					<div>
						<div class="num red" id="r-wrong">0</div>
						<div>❌ 答错</div>
					</div>
					<div>
						<div class="num" id="r-total">0</div>
						<div>📝 总题</div>
					</div>
				</div>
				<div class="result-actions">
					<button class="btn btn-primary" onclick="reviewWrong()">📕
						错题练习</button>
					<button class="btn btn-success" onclick="retry()">🔄 重新练习</button>
					<button class="btn btn-outline" onclick="goMain()">🏠 首页</button>
				</div>
			</div>
		</div>

		<!-- ========== 错题本 ========== -->
		<div id="page-wrongbook" class="page">
			<div class="back-row" onclick="goMain()">‹ 返回</div>
			<div class="card">
				<div class="flex-between">
					<h3>📕 错题本</h3>
					<span id="wb-count">0</span>
				</div>
				<div id="wrong-book-list"></div>
				<div class="wrong-actions">
					<button class="btn btn-warning" onclick="startWrong()">📝
						练习错题</button>
					<button class="btn btn-danger" onclick="clearWrongBook()">🗑️
						清空</button>
				</div>
			</div>
		</div>
	</div>

	<script>
// ================================================================
// 1. 题库数据（零售管理完整200题 + 运营管理示例）
// ================================================================

// ---------- 零售管理（完整200题，压缩字段） ----------
// 您需要将之前完整的200题数组粘贴到这里（字段名：i, t, q, o, a, s）
// 目前仅提供3条示例，请务必替换！
const RETAIL_BANK_RAW =  [
    // 1-100 单选题
    {id:1,type:'2-单选题',question:'大额存单部分提前支取时，留存金额不得低于（）元。',options:['50','10000','100000','200000'],answer:'D',source:'《秦皇岛银行个人存款业务管理办法》'},
    {id:2,type:'2-单选题',question:'目前一键绑卡支持绑定三方支付渠道共有（）个。',options:['3','4','5','6'],answer:'D',source:'零售银行部重点产品库'},
    {id:3,type:'2-单选题',question:'目前我行一年期整存整取储蓄存款在一年内的计息天数是（）天。',options:['360','365','366','30'],answer:'A',source:'《秦皇岛银行个人存款业务管理办法》'},
    {id:4,type:'2-单选题',question:'一位客户截止3月12日的AUM月日均(本月月日均)是48万元，3月13日存入2万元定期存款，后续客户资产无变动，那么客户下个月的客户等级是（）。',options:['贵宾客户','黄金客户','白金客户','钻石客户'],answer:'B',source:'《秦皇岛银行零售客户分层管理办法》'},
    {id:5,type:'2-单选题',question:'秦银商城客户贵宾节日（生日）回馈活动，客户生日当月的前三个月AUM月日均都在100万以上，那么客户可在生日当月领取（）秦贝。',options:['5000','10000','15000','20000'],answer:'C',source:'2026年秦银商城第三季度活动明白卡'},
    {id:6,type:'2-单选题',question:'秦银商城代发新客活动，首次在秦皇岛银行代发工资的客户，本年内连续两个月、四个月、六个月代发且连续期内月均代发金额≥3000元，可分别领取（）秦贝，每人限领取一次。',options:['500','1000','1500','2000'],answer:'B',source:'2026年秦银商城第三季度活动明白卡'},
    {id:7,type:'2-单选题',question:'白金卡是面向AUM值达到（）客户发行的等级借记卡，可享受优先叫号权益。',options:['50万','100万','200万','300万'],answer:'B',source:'零售银行部重点产品库'},
    {id:8,type:'2-单选题',question:'定制卡是面向私行客户群体推出的可定制卡号的白金卡 ，AUM值达到（）以上的客户在手机银行端申请并选择申领网点，银行卡制作完成后由卡厂统一邮寄到申领网点。',options:['50万','100万','200万','300万'],answer:'D',source:'零售银行部重点产品库'},
    {id:9,type:'2-单选题',question:'个人整存整取存款产品的存期不包括（）。',options:['3个月','6个月','9个月','1年'],answer:'C',source:'《秦皇岛银行个人存款业务管理办法》'},
    {id:10,type:'2-单选题',question:'定期存储蓄存款产品的转存方式不包括（）',options:['本息自动转存','利息自动转存','本金自动转存','不自动转存'],answer:'B',source:'《秦皇岛银行个人存款业务管理办法》'},
    {id:11,type:'2-单选题',question:'根据秦皇岛银行零售客户分层管理办法，客户月日均AUM大于20万，小于50万的客户属于（）',options:['贵宾客户','白金客户','黄金客户','钻石客户'],answer:'C',source:'《秦皇岛银行零售客户分层管理办法》'},
    {id:12,type:'2-单选题',question:'秦银商城集存单抽奖活动，客户每成功开立一张一年期（含）以上、（）元（含）以上的定期电子存单，即可在手机银行秦银商城活动页面获得一张对应的节气卡片及500秦贝。每个节气卡片及对应秦贝每位客户仅可领取一张。',options:['5000','10000','15000','20000'],answer:'B',source:'2026年秦银商城第三季度活动明白卡'},
    {id:13,type:'2-单选题',question:'秦银商城代发薪月月有礼活动，客户当月发薪大于等于（），且月日均资产较上月提升达到设定档次，次月8号起可登录手机银行参与抽奖。',options:['3000','4000','5000','6000'],answer:'C',source:'2026年秦银商城第三季度活动明白卡'},
    {id:14,type:'2-单选题',question:'秦银商城社保卡新客活动，客户首次开立个人社保卡账户的客户，可获得（）秦贝，每人限领取一次。',options:['500','1000','5000','10000'],answer:'B',source:'2026年秦银商城第三季度活动明白卡'},
    {id:15,type:'2-单选题',question:'秦银商城首购理财活动，客户首次签约我行代销理财业务的客户，且购买金额大于（）元，可在确认份额后获得1000秦贝。',options:['10000','20000','30000','50000'],answer:'A',source:'2026年秦银商城第三季度活动明白卡'},
    {id:16,type:'2-单选题',question:'根据《秦皇岛银行个人金融信息保护办法》，处理消费者金融信息应当遵循的原则不包括（ ）',options:['合法','正当','最大化','必要'],answer:'C',source:'《秦皇岛银行个人金融信息保护办法》'},
    {id:17,type:'2-单选题',question:'根据《秦皇岛银行个人金融信息保护办法》，各机构收集消费者金融信息应当限于（ ）',options:['最大范围','实现处理目的的最小范围','全行共享所需范围','营销拓展所需范围'],answer:'B',source:'《秦皇岛银行个人金融信息保护办法》'},
    {id:18,type:'2-单选题',question:'根据《秦皇岛银行个人金融信息保护办法》，向有合作关系的第三方提供消费者金融信息的，应当取得金融消费者的（ ）',options:['口头同意','默示同意','单独同意','概括授权'],answer:'C',source:'《秦皇岛银行个人金融信息保护办法》'},
    {id:19,type:'2-单选题',question:'根据《秦皇岛银行个人金融信息保护办法》，各机构应严格履行（ ），准确收录客户金融信息，及时维护更新。',options:['客户身份识别义务','金融营销义务','投资顾问义务','担保代偿义务'],answer:'A',source:'《秦皇岛银行个人金融信息保护办法》'},
    {id:20,type:'2-单选题',question:'根据《秦皇岛银行个人金融信息保护办法》，各在公共场所安装图像采集设备收集的个人图像、身份识别信息，只能用于（ ）。',options:['精准营销目的','维护公共安全的目的','内部员工考核','商业数据分析'],answer:'B',source:'《秦皇岛银行个人金融信息保护办法》'},
    {id:21,type:'2-单选题',question:'根据《秦皇岛银行个人数字银行业务管理办法》，网上银行限额是指客户名下所有活期账户通过网上银行发起交易金额的（ ）',options:['日均余额','最高上限','单笔最低限额','季度平均额'],answer:'B',source:'《秦皇岛银行个人数字银行业务管理办法》'},
    {id:22,type:'2-单选题',question:'根据《秦皇岛银行个人数字银行业务管理办法》，由总行统一设定、作为所有客户默认限额的是（ ）',options:['客户级限额','账户级限额','银行级限额','支行级限额'],answer:'C',source:'《秦皇岛银行个人数字银行业务管理办法》'},

function expandBank(raw) {
    return raw.map(item => {
        let answer = item.answer || item.a || '';
        // 1. 去除首尾空格
        answer = answer.trim();
        // 2. 统一多选分隔符为英文逗号
        answer = answer.replace(/[，、\s]+/g, ','); 
        // 注意：上面的正则会将连续的逗号、空格、中文逗号替换为单个英文逗号
        // 去除多余重复逗号
        answer = answer.replace(/,+/g, ',');
        // 去除首尾逗号
        answer = answer.replace(/^,|,$/g, '');
        return {
            id: item.id || item.i,
            type: item.type || item.t,
            question: item.question || item.q,
            options: item.options || item.o,
            answer: answer,
            source: item.source || item.s || '无分类'
        };
    });
}

    '智能柜台业务管理办法 第四章第十五条': '智能柜台业务',
    '智能柜台业务管理办法 第六章第二十条': '智能柜台业务',
    '关于规范我行移动外派上门业务办理流程的通知': '智能柜台业务',
};


function getCategory(q) {
    if (currentBankKey === 'retail') {
        if (RETAIL_CATEGORY_MAP[q.source]) return RETAIL_CATEGORY_MAP[q.source];
        const raw = q.source.replace(/《|》/g, '').trim();
        return raw || '其他';
    } else {
        return q.source || '未分类';
    }
}

// ================================================================
// 3. 全局状态与存储
// ================================================================

let state = {
    questions: [],
    currentIndex: 0,
    answers: {},
    wrongIds: [],
    completed: false
};
let isAnswered = false;
let isWrongBlocked = false;
let stats = { total: 0, correct: 0 };
let toastTimer = null;

function getStorageKey(suffix) {
    return 'quiz_' + (currentBankKey || 'unknown') + '_' + suffix;
}

function loadStats() {
    try {
        const data = JSON.parse(localStorage.getItem(getStorageKey('stats')) || '{"total":0,"correct":0}');
        stats = data;
    } catch(e) { stats = { total:0, correct:0 }; }
}
function saveStats() { localStorage.setItem(getStorageKey('stats'), JSON.stringify(stats)); }

function loadWrongBook() {
    try { return JSON.parse(localStorage.getItem(getStorageKey('wrong')) || '[]'); } catch(e) { return []; }
}
function saveWrongBook(ids) { localStorage.setItem(getStorageKey('wrong'), JSON.stringify(ids)); }

function loadPracticeState() {
    try { return JSON.parse(localStorage.getItem(getStorageKey('practice')) || 'null'); } catch(e) { return null; }
}
function savePracticeState() {
    const data = {
        questions: state.questions.map(q => q.id),
        currentIndex: state.currentIndex,
        answers: state.answers,
        wrongIds: state.wrongIds,
        completed: state.completed
    };
    localStorage.setItem(getStorageKey('practice'), JSON.stringify(data));
}
function clearPracticeState() { localStorage.removeItem(getStorageKey('practice')); }

// ================================================================
// 4. UI 与导航
// ================================================================

function goHome() {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-home').classList.add('active');
    document.getElementById('bank-status').textContent = '请选择题库开始练习';
}

function goMain() {
    if (!currentBankKey) { showToast('请先选择题库'); return; }
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-main').classList.add('active');
    const label = document.getElementById('current-bank-label');
    if (label) {
        label.textContent = (currentBankKey === 'retail' ? '🏪 零售管理' : '⚙️ 运营管理');
    } else {
        console.warn('未找到 current-bank-label 元素');
    }
    updateHomeStats();
    updateWrongBadge();
}

function selectBank(key) {
    // 如果已加载且切换相同题库，直接跳转
    if (key === currentBankKey && currentBankData.length > 0) {
        goMain();
        return;
    }
    // 加载题库
    if (key === 'retail') {
        if (RETAIL_BANK_RAW.length === 0) {
            showToast('⚠️ 零售管理数据为空，请补充');
            return;
        }
        currentBankData = expandBank(RETAIL_BANK_RAW);
    } else if (key === 'operation') {
        if (OPERATION_BANK_RAW.length === 0) {
            showToast('⚠️ 运营管理数据为空，请补充');
            return;
        }
        currentBankData = expandBank(OPERATION_BANK_RAW);
    } else return;
    
    // 【关键修复】先更新标题再重置状态
    currentBankKey = key;
    // +++ 强制更新标题 +++
    const label = document.getElementById('current-bank-label');
    if (label) {
        label.textContent = (key === 'retail' ? '🏪 零售管理' : '⚙️ 运营管理');
    }
    
    // 重置状态
    state.questions = [];
    state.currentIndex = 0;
    state.answers = {};
    state.wrongIds = [];
    state.completed = false;
    isAnswered = false;
    isWrongBlocked = false;
    clearPracticeState();
    loadStats();
    goMain();   // goMain 中也会更新标题，但以强制更新为准
    showToast('已加载 ' + (key === 'retail' ? '零售管理' : '运营管理') + ' 题库，共 ' + currentBankData.length + ' 道题');
}

function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

// ================================================================
// 5. 核心功能（顺序、专项、错题等）
// ================================================================

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startOrder() {
    if (!currentBankData.length) { showToast('当前题库为空'); return; }
    const shuffled = shuffleArray([...currentBankData]);
    state.questions = shuffled;
    state.currentIndex = 0;
    state.answers = {};
    state.wrongIds = [];
    state.completed = false;
    isAnswered = false;
    isWrongBlocked = false;
    savePracticeState();
    switchPage('page-practice');
    renderQuestion();
}

function showChapters() {
    if (!currentBankData.length) { showToast('当前题库为空'); return; }
    const categoryMap = new Map();
    currentBankData.forEach(q => {
        const cat = getCategory(q);
        if (!categoryMap.has(cat)) categoryMap.set(cat, []);
        categoryMap.get(cat).push(q);
    });
    const list = document.getElementById('chapter-list');
    list.innerHTML = '';
    for (let [cat, questions] of categoryMap) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-success';
        btn.textContent = `${cat} (${questions.length}题)`;
        btn.onclick = () => startSpecial(cat);
        list.appendChild(btn);
    }
    switchPage('page-chapter');
}

function startSpecial(category) {
    const filtered = currentBankData.filter(q => getCategory(q) === category);
    if (filtered.length === 0) { showToast('该分类下暂无题目'); return; }
    const shuffled = shuffleArray([...filtered]);
    state.questions = shuffled;
    state.currentIndex = 0;
    state.answers = {};
    state.wrongIds = [];
    state.completed = false;
    isAnswered = false;
    isWrongBlocked = false;
    savePracticeState();
    switchPage('page-practice');
    renderQuestion();
}

function startWrong() {
    const wrongIds = loadWrongBook();
    if (wrongIds.length === 0) { showToast('错题本为空 🎉'); return; }
    const filtered = currentBankData.filter(q => wrongIds.includes(q.id));
    if (filtered.length === 0) { showToast('错题数据异常'); return; }
    const shuffled = shuffleArray(filtered);
    state.questions = shuffled;
    state.currentIndex = 0;
    state.answers = {};
    state.wrongIds = [];
    state.completed = false;
    isAnswered = false;
    isWrongBlocked = false;
    savePracticeState();
    switchPage('page-practice');
    renderQuestion();
}

function retry() { startOrder(); }
function goMain() { switchPage('page-main'); updateHomeStats(); }
function confirmExit() { if (confirm('确定退出练习吗？')) goMain(); }


//获取正确答案的选项索引列表
function getCorrectIndices(q) {
    const labels = ['A','B','C','D','E'];
    if (/^[A-Z]+$/.test(q.answer)) {
        return q.answer.split('').map(l => labels.indexOf(l));
    } else {
        const indices = [];
        q.options.forEach((opt, i) => {
            if (opt === q.answer) indices.push(i);
        });
        return indices;
    }
}

function renderQuestion() {
    const qs = state.questions;
    if (!qs || qs.length === 0 || state.currentIndex >= qs.length) {
        showResultPage();
        return;
    }
    const q = qs[state.currentIndex];
    const idx = state.currentIndex;
    const total = qs.length;

    document.getElementById('practice-progress').textContent = `${idx+1}/${total}`;
    document.getElementById('practice-bar').style.width = `${((idx+1)/total)*100}%`;
    document.getElementById('q-number').textContent = `第 ${idx+1} 题`;
    document.getElementById('q-type').textContent = q.type.includes('多选题') ? '多选题' : (q.type.includes('判断') ? '判断题' : '单选题');
    document.getElementById('q-text').textContent = q.question;

    const optContainer = document.getElementById('q-options');
    optContainer.innerHTML = '';
    const labels = ['A','B','C','D','E'];
    const isMulti = q.type.includes('多选题');

    let selectedValue = state.answers[q.id];
    let selectedIndices = [];
    if (selectedValue !== undefined && selectedValue !== -1 && selectedValue !== '') {
        if (isMulti) { selectedIndices = selectedValue.split(',').map(Number); }
        else { selectedIndices = [Number(selectedValue)]; }
    }

    const correctIndices = getCorrectIndices(q);

    q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        const isSelected = selectedIndices.includes(i);
        const isCorrect = correctIndices.includes(i);
        if (isAnswered) {
            div.classList.add('disabled');
            if (isCorrect) div.classList.add('correct');
            if (isSelected && !isCorrect) div.classList.add('wrong');
        } else {
            if (isSelected) div.classList.add('selected');
            div.onclick = () => selectOption(i);
        }
        div.textContent = `${labels[i]}. ${opt}`;
        optContainer.appendChild(div);
    });

    const sourceBox = document.getElementById('source-box');
    const sourceText = document.getElementById('source-text');
    const wrongHint = document.getElementById('wrong-hint');
    const correctAnswerEl = document.getElementById('correct-answer');

    if (isAnswered) {
        let isCorrect;
        if (isMulti) {
            const user = selectedValue.split(',').map(Number).sort();
            const correct = correctIndices.sort();
            isCorrect = user.length === correct.length && user.every((v,i) => v === correct[i]);
        } else {
            isCorrect = Number(selectedValue) === correctIndices[0];
        }
        const correctLetters = q.answer;
        correctAnswerEl.textContent = `✅ 正确答案：${correctLetters}`;
        if (isCorrect) {
            sourceBox.classList.add('show');
            wrongHint.textContent = '';
            sourceText.textContent = q.source || '无出处';
            setTimeout(() => sourceBox.classList.remove('show'), 1000);
        } else {
            sourceBox.classList.add('show');
            wrongHint.textContent = '❌ 回答错误，请点击「下一题」继续';
            sourceText.textContent = q.source || '无出处';
        }
    } else {
        sourceBox.classList.remove('show');
        wrongHint.textContent = '';
        correctAnswerEl.textContent = '';
    }

    document.getElementById('btn-submit').style.display = isAnswered ? 'none' : 'block';
    const btnNext = document.getElementById('btn-next');
    if (isAnswered) { btnNext.style.display = 'block'; btnNext.textContent = idx + 1 < total ? '下一题 →' : '查看结果 🎯'; }
    else { btnNext.style.display = 'none'; }

    savePracticeState();
    updateHomeStats();
}

function selectOption(index) {
    if (isAnswered) return;
    const q = state.questions[state.currentIndex];
    const isMulti = q.type.includes('多选题');
    if (isMulti) {
        let current = state.answers[q.id] !== undefined ? state.answers[q.id].split(',').map(Number) : [];
        if (current.includes(index)) { current = current.filter(v => v !== index); }
        else { current.push(index); }
        current.sort((a,b) => a-b);
        state.answers[q.id] = current.join(',');
    } else {
        state.answers[q.id] = index;
    }
    renderQuestion();
}

function submitAnswer() {
    if (isAnswered) return;
    const q = state.questions[state.currentIndex];
    const selected = state.answers[q.id];
    if (selected === undefined || selected === -1 || selected === '') { showToast('请先选择一个选项'); return; }

    const isMulti = q.type.includes('多选题');
    const correctIndices = getCorrectIndices(q);
    let isCorrect;
    if (isMulti) {
        const user = selected.split(',').map(Number).sort();
        const correct = correctIndices.sort();
        isCorrect = user.length === correct.length && user.every((v,i) => v === correct[i]);
    } else {
        isCorrect = Number(selected) === correctIndices[0];
    }

    isAnswered = true;
    stats.total++;
    if (isCorrect) {
        stats.correct++;
        let wrong = loadWrongBook();
        wrong = wrong.filter(id => id !== q.id);
        saveWrongBook(wrong);
    } else {
        let wrong = loadWrongBook();
        if (!wrong.includes(q.id)) { wrong.push(q.id); saveWrongBook(wrong); }
        if (!state.wrongIds.includes(q.id)) state.wrongIds.push(q.id);
        isWrongBlocked = true;
    }
    saveStats();
    renderQuestion();
    updateHomeStats();
}

function nextQuestion() {
    if (isWrongBlocked) {
        isWrongBlocked = false;
        if (state.currentIndex + 1 >= state.questions.length) { state.completed = true; showResultPage(); return; }
        state.currentIndex++;
        isAnswered = false;
        renderQuestion();
        return;
    }
    if (!isAnswered) { showToast('请先提交答案'); return; }
    if (state.currentIndex + 1 < state.questions.length) {
        state.currentIndex++;
        isAnswered = false;
        isWrongBlocked = false;
        renderQuestion();
    } else {
        state.completed = true;
        showResultPage();
    }
}

function showResultPage() {
    const qs = state.questions;
    let correct = 0, wrong = 0;
    qs.forEach(q => {
        const ans = state.answers[q.id];
        const isMulti = q.type.includes('多选题');
        let isCorrect;
        if (ans !== undefined && ans !== -1 && ans !== '') {
            if (isMulti) {
                const user = ans.split(',').map(Number).sort();
                const correct = q.answer.split('').map(l => 'ABCDE'.indexOf(l)).sort();
                isCorrect = user.length === correct.length && user.every((v,i) => v === correct[i]);
            } else {
                isCorrect = Number(ans) === 'ABCDE'.indexOf(q.answer);
            }
            if (isCorrect) correct++;
            else wrong++;
        } else { wrong++; }
    });
    const rate = qs.length > 0 ? Math.round((correct / qs.length) * 100) : 0;
    document.getElementById('result-score').textContent = rate + '%';
    document.getElementById('r-correct').textContent = correct;
    document.getElementById('r-wrong').textContent = wrong;
    document.getElementById('r-total').textContent = qs.length;
    switchPage('page-result');
}

function reviewWrong() {
    const ids = state.wrongIds;
    if (ids.length === 0) { showToast('没有错题'); return; }
    const pool = currentBankData.filter(q => ids.includes(q.id));
    if (pool.length === 0) { showToast('错题数据异常'); return; }
    const shuffled = shuffleArray(pool);
    state.questions = shuffled;
    state.currentIndex = 0;
    state.answers = {};
    state.wrongIds = [];
    state.completed = false;
    isAnswered = false;
    isWrongBlocked = false;
    savePracticeState();
    switchPage('page-practice');
    renderQuestion();
}

function renderWrongBook() {
    const ids = loadWrongBook();
    const list = document.getElementById('wrong-book-list');
    if (ids.length === 0) { list.innerHTML = '<div class="text-muted" style="text-align:center;padding:20px;">🎉 暂无错题</div>'; return; }
    const labels = ['A','B','C','D','E'];
    list.innerHTML = ids.map((id, idx) => {
        const q = currentBankData.find(item => item.id === id);
        if (!q) return '';
        const correctAns = q.answer;
        return `<div class="wb-item"><span class="idx">${idx+1}</span><div class="content"><div>${q.question}</div><div style="color:#16a34a;font-size:13px;">✅ ${correctAns}</div></div><span class="badge">${q.source.replace(/《|》/g,'')}</span></div>`;
    }).join('');
    switchPage('page-wrongbook');
}

function clearWrongBook() {
    if (loadWrongBook().length === 0) { showToast('错题本已空'); return; }
    if (!confirm('确定清空错题本吗？')) return;
    saveWrongBook([]);
    renderWrongBook();
    updateHomeStats();
    showToast('已清空');
}

function updateHomeStats() {
    document.getElementById('p-total').textContent = stats.total;
    document.getElementById('p-correct').textContent = stats.correct;
    const rate = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
    document.getElementById('p-rate').textContent = rate + '%';
    document.getElementById('total-count').textContent = currentBankData.length;
    updateWrongBadge();
}

function updateWrongBadge() {
    const wrong = loadWrongBook();
    document.getElementById('wrong-badge').textContent = wrong.length;
    document.getElementById('wb-count').textContent = wrong.length;
}

function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ================================================================
// 6. 初始化
// ================================================================

document.addEventListener('DOMContentLoaded', function() {
    goHome();
});

// 暴露全局
window.selectBank = selectBank;
window.startOrder = startOrder;
window.startSpecial = startSpecial;
window.startWrong = startWrong;
window.showChapters = showChapters;
window.goHome = goHome;
window.goMain = goMain;
window.confirmExit = confirmExit;
window.submitAnswer = submitAnswer;
window.nextQuestion = nextQuestion;
window.reviewWrong = reviewWrong;
window.retry = retry;
window.clearWrongBook = clearWrongBook;
window.renderWrongBook = renderWrongBook;
window.showToast = showToast;
window.switchPage = switchPage;
window.renderQuestion = renderQuestion;
window.updateHomeStats = updateHomeStats;
</script>
